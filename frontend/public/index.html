<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
        <meta name="theme-color" content="#33C5E3" />
        <meta name="description" content="VitalaMatch - Where Healthcare Careers Find Their Perfect Match. Swipe to find your dream medical job or ideal healthcare candidate." />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="VitalaMatch" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="msapplication-TileColor" content="#33C5E3" />
        <meta name="msapplication-tap-highlight" content="no" />
        
        <!-- PWA Manifest -->
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
        
        <!-- Icons -->
        <link rel="icon" href="%PUBLIC_URL%/images/vitalamatch-icon.png" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/images/vitalamatch-icon.png" />
        
        <title>VitalaMatch - Healthcare Job Matching</title>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
        <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
        <!-- Service Worker Registration -->
        <script>
            if ('serviceWorker' in navigator) {
                window.addEventListener('load', function() {
                    navigator.serviceWorker.register('/sw.js')
                        .then(function(registration) {
                            console.log('VitalaMatch SW registered:', registration.scope);
                        })
                        .catch(function(error) {
                            console.log('VitalaMatch SW registration failed:', error);
                        });
                });
            }
        </script>
    </body>
</html>
